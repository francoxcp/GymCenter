<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="description" content="GYMLAB: tus rutinas, progreso y logros en un solo lugar.">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="color-scheme" content="dark">

  <!-- PWA en iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GYMLAB">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>GYMLAB</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0A0A0A;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    #gc-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #0A0A0A;
      z-index: 9999;
      transition: opacity .35s ease;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #gc-splash.hidden { opacity: 0; pointer-events: none; }
    #gc-splash img {
      width: 112px;
      height: 112px;
      border-radius: 26px;
      box-shadow: 0 0 40px rgba(255, 235, 0, .25);
    }
    #gc-splash .bar {
      width: 120px;
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, .1);
      overflow: hidden;
    }
    #gc-splash .bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      background: #FFEB00;
      border-radius: 3px;
      animation: gc-load 1.1s ease-in-out infinite;
    }
    #gc-splash p {
      margin: 0;
      color: #B0B0B0;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    @keyframes gc-load {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }
  </style>
</head>
<body>
  <div id="gc-splash">
    <img src="icons/Icon-192.png" alt="GYMLAB">
    <div class="bar"></div>
    <p>GYMLAB</p>
  </div>
  <script src="gc_bridge.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
